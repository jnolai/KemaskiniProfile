<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 230" fill="none">
  <defs>
    <!-- Vibrant 3D Gradient for Dynamic Orange Arrow Swoosh -->
    <linearGradient id="ggOrangeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D84315" />
      <stop offset="30%" stop-color="#F4511E" />
      <stop offset="65%" stop-color="#FF6D00" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>

    <!-- Top Wing Crescent Gradient -->
    <linearGradient id="ggTopWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
  </defs>

  <!-- 🔷 Hexagon Emblem from GG.jpg -->
  <g id="emblem-gg" transform="translate(10, 8)">
    <!-- 1. Dark Navy Hexagon Frame -->
    <path 
      d="M 96 18 L 174 62 L 174 152 L 96 196 L 18 152 L 18 62 Z" 
      fill="none" 
      stroke="#0E2A54" 
      stroke-width="16" 
      stroke-linejoin="round" 
      stroke-linecap="round"
    />

    <!-- 2. Dark Navy Bottom-Left Arc looping into 'e' -->
    <path 
      d="M 8 116 C 6 138, 24 156, 52 146 C 76 138, 92 122, 102 104" 
      fill="none" 
      stroke="#0E2A54" 
      stroke-width="13" 
      stroke-linecap="round" 
    />

    <!-- 3. Inner 'e' Shape in solid Navy -->
    <path 
      d="M 96 68 C 75 68, 60 82, 60 102 C 60 122, 75 136, 96 136 C 112 136, 124 128, 129 116 L 113 108 C 110 114, 104 118, 96 118 C 85 118, 77 110, 76 99 L 131 99 C 131.5 97, 132 94, 132 91 C 132 78, 118 68, 96 68 Z M 76 88 C 79 79, 86 75, 96 75 C 105 75, 112 79, 114 88 L 76 88 Z" 
      fill="#0E2A54"
    />

    <!-- 4. Dynamic Orange Arrow Swoosh Arching Upward-Right -->
    <path 
      d="M 28 126 C 42 152, 88 158, 124 130 C 154 106, 172 66, 186 26 C 172 38, 156 46, 142 48 C 156 58, 144 86, 120 102 C 92 120, 60 114, 42 98 Z" 
      fill="url(#ggOrangeGrad)" 
    />
    
    <!-- 5. Arrow Tip and Dynamic Wings -->
    <path 
      d="M 186 26 L 191 52 C 182 46, 170 45, 158 48 Z" 
      fill="url(#ggOrangeGrad)" 
    />
    <path 
      d="M 186 26 L 158 48 C 166 42, 176 36, 186 26 Z" 
      fill="#BF360C" 
      opacity="0.8"
    />
    <path 
      d="M 148 38 C 160 38, 180 44, 192 60 C 190 48, 180 38, 166 34 Z" 
      fill="url(#ggTopWingGrad)" 
    />
  </g>

  <!-- 🔶 Wordmark: "eKemaskini" & "- Portal Profil Pelanggan" -->
  <g id="typography-gg">
    <!-- "e" in vibrant orange -->
    <text 
      x="235" 
      y="126" 
      font-family="'Plus Jakarta Sans', 'Outfit', 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-size="118" 
      font-weight="900" 
      fill="#FF6D00" 
      letter-spacing="-1"
    >e</text>

    <!-- "Kemaskini" in dark navy -->
    <text 
      x="308" 
      y="126" 
      font-family="'Plus Jakarta Sans', 'Outfit', 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-size="118" 
      font-weight="900" 
      fill="#0E2A54" 
      letter-spacing="-1.8"
    >Kemaskini</text>

    <!-- Subtitle: "- Portal Profil Pelanggan" -->
    <text 
      x="235" 
      y="188" 
      font-family="'Plus Jakarta Sans', 'Outfit', 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-size="43" 
      font-weight="700" 
      fill="#0E2A54" 
      letter-spacing="0.5"
    >- Portal Profil Pelanggan</text>
  </g>
</svg>
